[package]
name = "nexus-registry"
version = "0.1.0"
edition = "2024"

[features]
testutils = ["soroban-sdk/testutils"]

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27"

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
debug = false
codegen-units = 1
